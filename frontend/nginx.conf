server {
listen 80;
root /usr/share/nginx/html;
index index.html;

location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
   }

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
   }

location / {
    try_files $uri /index.html;
   }
}
